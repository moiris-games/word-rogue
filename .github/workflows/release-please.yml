name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A PAT is required here (not the default GITHUB_TOKEN): events
          # produced by GITHUB_TOKEN don't trigger other workflows (GitHub's
          # recursive workflow protection), and android-build.yml runs on
          # `release: published` — which this action is what publishes.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
