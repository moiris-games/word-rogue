name: CI

# TEC-053: runs on every pull request and every push to main, on Node 22.
# Any failure blocks merge.

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # `eslint .` rather than `expo lint`: expo lint only walks its own known
      # directories and silently skips lib/, which is precisely where the
      # engine-core boundary rules of TEC-007 live. Running eslint directly
      # lets the flat config's own file patterns decide what is linted.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # TEC-023 / ENG-006: the corpus runner, content validation and the
      # benchmark all import the shipped engine modules directly and run
      # under tsx. Each exits non-zero on failure (TEC-057).
      - name: Golden corpus
        run: npm run corpus

      - name: Content validation
        run: npm run validate:content

      - name: Engine benchmark
        run: npm run bench
