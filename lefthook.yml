# Lefthook configuration
# https://github.com/evilmartians/lefthook
#
# Installed by `npm run prepare` (lefthook install).

pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.{js,ts,jsx,tsx,cjs,mjs}"
      # Matches CI: eslint directly, so the engine-core boundary rules of
      # TEC-007 apply to staged files under lib/ too.
      run: npx eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}
